[project]
name = "quant-trading"
version = "0.1.0"
description = "A股量化交易系统 - Quantitative Trading System for A-Shares"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    "akshare>=1.14.0",
    "sqlalchemy>=2.0",
    "pandas>=2.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
]
dev = [
    "quant-trading[test]",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_center", "src/risk_manager"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
